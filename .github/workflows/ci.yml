name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        # 0.84.4 is the version the rules were measured on; 1.x is current,
        # and the only one with the SDK hooks tests/sdk.test.ts needs.
        pi: [pinned, "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.pi != 'pinned'
        run: npm install --no-save @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: npm run typecheck
      - run: npm test
